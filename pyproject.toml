[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scentmatch"
version = "0.7.0"
description = "Natural-language perfume retrieval project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "rapidfuzz>=3.9,<4",
]

[project.scripts]
scentmatch-download = "scentmatch.data.download:main"
scentmatch-validate = "scentmatch.data.validate:main"
scentmatch-eda = "scentmatch.data.eda:main"
scentmatch-select = "scentmatch.data.select:main"
scentmatch-audit = "scentmatch.data.audit:main"
scentmatch-eval-validate = "scentmatch.evaluation.validate:main"
scentmatch-silver-label = "scentmatch.evaluation.silver:main"
scentmatch-e5 = "scentmatch.retrieval.e5:main"
scentmatch-search = "scentmatch.cli:search_main"
scentmatch-generate-train = "scentmatch.training.generate:main"
scentmatch-mine-negatives = "scentmatch.training.mine:main"
scentmatch-compare = "scentmatch.evaluation.compare:main"
scentmatch-augment = "scentmatch.data.augment:main"
scentmatch-prepare-reviews = "scentmatch.data.reviews:main"
scentmatch-review-index = "scentmatch.retrieval.review_index:main"
scentmatch-parse-intent = "scentmatch.retrieval.intent:main"
scentmatch-eval-v2 = "scentmatch.evaluation.v2:main"
scentmatch-community-v2 = "scentmatch.data.community_v2:main"
scentmatch-eval-ranking-v3 = "scentmatch.evaluation.ranking_v3:main"
scentmatch-community-text = "scentmatch.retrieval.community_text:main"
scentmatch-blind-eval = "scentmatch.evaluation.blind_v4:main"
scentmatch-train-link = "scentmatch.training.link_prediction:main"
scentmatch-api = "scentmatch.api:api_main"
scentmatch-app = "scentmatch.web:app_main"
scentmatch-benchmark = "scentmatch.benchmark:main"
scentmatch-runtime-check = "scentmatch.runtime:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "jupyterlab>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
ml = [
    "accelerate>=1,<2",
    "datasets>=3,<5",
    "numpy>=1.26,<3",
    "sentence-transformers>=5.6,<6",
    "scikit-learn>=1.5,<2",
]
inference = [
    "numpy>=1.26,<3",
    "sentence-transformers>=5.6,<6",
]
app = [
    "fastapi>=0.115,<1",
    "gradio>=5,<7",
    "psutil>=6,<8",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
